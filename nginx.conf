server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip pour perfs
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Vela core
    location /vela {
        try_files $uri $uri/ /vela/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Vela PineTS
    location /vela-pinets {
        try_files $uri $uri/ /vela-pinets/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Redirect root vers Vela
    location = / {
        return 301 /vela;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
